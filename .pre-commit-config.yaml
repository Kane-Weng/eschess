# Auto-format + lint on commit. Mirrors the CI `lint` job (which runs
# `pre-commit run --all-files`), so local and CI enforce identically.
#
#   uv run pre-commit install      # enable the git hook
#   uv run pre-commit run --all-files
repos:
  # Python: format + import sort + pyflakes/pycodestyle (config in pyproject.toml).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^python/
      - id: ruff-format
        files: ^python/

  # C++: clang-format pinned to v17 (matches .clang-format / local toolchain).
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v17.0.6
    hooks:
      - id: clang-format
        files: ^cpp/.*\.(cpp|hpp)$

  # Rust: rustfmt + clippy on both crates, using the system toolchain.
  - repo: local
    hooks:
      - id: cargo-fmt-rust
        name: cargo fmt (rust)
        entry: cargo fmt --manifest-path rust/Cargo.toml --
        language: system
        files: ^rust/.*\.rs$
        pass_filenames: false
      - id: cargo-fmt-rust-ffi
        name: cargo fmt (rust-ffi)
        entry: cargo fmt --manifest-path rust-ffi/Cargo.toml --
        language: system
        files: ^rust-ffi/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy-rust
        name: cargo clippy (rust)
        entry: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
        language: system
        files: ^rust/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy-rust-ffi
        name: cargo clippy (rust-ffi)
        entry: cargo clippy --manifest-path rust-ffi/Cargo.toml --all-targets -- -D warnings
        language: system
        files: ^rust-ffi/.*\.rs$
        pass_filenames: false
