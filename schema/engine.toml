# ═══════════════════════════════════════════════════════════════════════════════
# REFERENCE ONLY (NOT generated) — the behavioral contract the ports must honor,
# guarded by the parity tests rather than by codegen.
# ═══════════════════════════════════════════════════════════════════════════════
#
# structs:
#   Move (search form)  = (from: 0-63, to: 0-63, promotion: PieceType|None/-1)
#   Undo / board Move   = from, to, captured_piece, captured_color, promotion,
#                         is_en_passant, is_castle, castle_rook_from/to,
#                         prev_en_passant_square, prev_castling_rights,
#                         prev_halfmove_clock, prev_zobrist_key
#   CBoard              = colors[2], pieces[6], turn, en_passant_square,
#                         castling_rights, halfmove_clock, fullmove, game_over,
#                         winner, zobrist_key
#                         (divergences: rust turn:usize vs Color enum;
#                          rust Piece.ptype vs cpp/py Piece.type;
#                          sentinels -1 in cpp/rust vs None in python)
#   TTEntry             = key, depth, flag, score, best_move (+ valid in cpp/rust)
#   SearchInfo (telem)  = nodes, nps, score, depth, time_s, pv, multipv, effort,
#                         stm_white
#
# api:
#   Search.get_best_move(board, depth=3, time_limit_ms=None) -> Move|None
#   Search.search_position(board, max_depth, time_limit_ms, info_callback)
#                         -> (Move, score)        # score in pawns, White's POV
#   CBoard.get_all_legal_moves() -> [(square, legal_bits_u64)]
#   BaseEvaluate.evaluate(board) -> float         # pawns, + = White better
#
# wire_contracts:
#   FEN : "<placement> <side> <castling> <ep> <halfmove> <fullmove>"
#         placement rank8->rank1, '/'-separated, digits = empty runs.
#   UCI : moves as "e2e4" / "e7e8q"; "score cp N" or "score mate N" from STM POV.
#   web : JSON, camelCase boundary (mirrors web/frontend/src/lib/engine/types.ts)
#         req  { fen, depth, eval, multipv }
#         resp { bestmove, info: { nodes, nps, score, depth, timeMs, pv[],
#                                  multipv[], effort{}, stmWhite } }
#
# Eval positional bonuses remain inline literals in each port (low drift risk,
# woven into expressions): simple eval 0.5 doubled / 0.50,0.25 knight / 0.75 king;
# complex eval 0.20 doubled / 0.25 isolated / 0.50 bishop-pair / 0.005 mobility;
# checkmate score base 9000 (+depth) in minimax.
