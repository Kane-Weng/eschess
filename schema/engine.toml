# ─────────────────────────────────────────────────────────────────────────────
# eschess engine schema — SINGLE SOURCE OF TRUTH
#
# The chess engine is implemented in python/, cpp/, & rust/ as parallel
# ports kept identical by parity tests (perft + fixed-depth search). The enums
# and constant tables below are the values those ports MUST share byte-for-byte.
# This file is the canonical origin; `schema/codegen.py` renders it into:
#
#     python/engine/_generated.py     cpp/src/generated.hpp     rust/src/generated.rs
#
# Edit values HERE, then run `python3 schema/codegen.py` and commit the result.
# A CI / pre-commit freshness check fails if the generated files are stale.
#
# Scope: only pure DATA (enums + constant tables) is generated. Behavior
# (move generation, search, FEN parsing) and the struct/API/wire-contract specs
# at the bottom are reference documentation, validated by the parity tests, not
# generated. 
# ─────────────────────────────────────────────────────────────────────────────

[meta]
schema_version = 1
source = "python/engine (board.py, search.py, evaluate.py, transposition.py, uci.py)"

# ═══════════════════════════════════════════════════════════════════════════════
# ENUMS
# Each port renders these differently; codegen encodes the per-language idiom:
#   python -> IntEnum   cpp -> enum / enum class   rust -> pub const / pub enum
# ═══════════════════════════════════════════════════════════════════════════════

[[enum]]
name = "Color"
members = [["WHITE", 0], ["BLACK", 1]]
cpp_kind = "enum"                 # enum Color { WHITE = 0, BLACK = 1 };
rust_kind = "const"               # pub const WHITE: usize = 0; ...
rust_const_type = "usize"
# Behavior kept with the enum on the Python side (cpp/rust expose a free fn).
py_methods = """
def opponent(self) -> "Color":
    return Color(1 - self.value)
"""

[[enum]]
name = "PieceType"
members = [["PAWN", 0], ["KNIGHT", 1], ["BISHOP", 2], ["ROOK", 3], ["QUEEN", 4], ["KING", 5]]
cpp_kind = "enum"
cpp_extra = [["NO_PIECE", -1]]    # cpp folds the sentinel into the enum
rust_kind = "const"
rust_const_type = "usize"

[[enum]]
name = "TTFlag"
members = [["EXACT", 0], ["LOWER", 1], ["UPPER", 2]]
cpp_kind = "enum_class"           # enum class TTFlag { EXACT = 0, ... };
rust_kind = "enum"                # pub enum TTFlag { Exact, Lower, Upper }
rust_variant_case = "pascal"      # EXACT -> Exact
rust_derives = ["Clone", "Copy", "PartialEq", "Eq"]
rust_explicit_values = false      # variants carry no `= N`

# ═══════════════════════════════════════════════════════════════════════════════
# SCALARS
# ═══════════════════════════════════════════════════════════════════════════════

