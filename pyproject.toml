[project]
name = "eschess"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.1",
]

[project.optional-dependencies]
# Neural-network training/inference (python/nn). Heavy; only needed for the nets.
nn = [
    "torch>=2.0",
    "numpy>=1.24",
    "datasets>=2.14",
]
# Cross-language telemetry plots (harness/telemetry.py). Only needed for charts;
# the benchmark itself always writes CSV without it.
bench = [
    "matplotlib>=3.7",
]
